<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0ea" />
  <meta name="description" content="T-muse — 记录你的穿搭审美。" />
  <title>T-muse · 穿搭审美</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./editorial.css?v=detail-safe-area-1" />
</head>
<body>
  <div class="device-stage" aria-label="iPhone 16 Pro 真机预览">
    <div class="device-frame">
  <main class="app-shell" aria-label="T-muse 穿搭审美首页">
    <div class="dynamic-island" aria-hidden="true"><span></span></div>
    <div class="system-status" aria-label="设备状态栏">
      <span class="system-time">9:41</span>
      <div class="system-icons" aria-hidden="true">
        <svg viewBox="0 0 20 12"><path d="M1 11h2V8H1v3Zm5 0h2V5H6v6Zm5 0h2V2h-2v9Zm5 0h2V0h-2v11Z"/></svg>
        <svg class="wifi" viewBox="0 0 18 13"><path d="M1 4.2C5.6.2 12.4.2 17 4.2M4 7.3c3-2.5 7-2.5 10 0M7.1 10.3c1.2-1 2.6-1 3.8 0M9 12h.01"/></svg>
        <span class="battery"><i></i></span>
      </div>
    </div>
    <header class="topbar">
      <span class="brand-wordmark" aria-label="T-muse">T-muse</span>
      <button class="round-button" type="button" aria-label="打开设置" data-action="settings">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.06V21h-4v-.08A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.06-.4H2.5v-4h.08A1.7 1.7 0 0 0 4.2 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.66 3.8l.06.06A1.7 1.7 0 0 0 8.6 4.2a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 10 2.54V2.5h4v.08A1.7 1.7 0 0 0 15 4.2a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.6a1.7 1.7 0 0 0 .6 1c.3.25.67.39 1.06.4h.44v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/>
        </svg>
      </button>

      <button class="round-button monogram" type="button" aria-label="打开个人主页" data-action="profile">M</button>
      <div class="home-topbar-labels"><span>收藏</span><output class="home-total-pages" aria-label="所有卡片共 1 页">1 PAGE</output></div>
    </header>

    <section class="canvas" aria-label="今日穿搭画布">
      <div class="home-card-carousel">
      <div class="home-card-name" role="button" tabindex="0" title="双击重命名" aria-label="卡片名称，双击重命名">我的搭配</div>
      <span class="home-card-index" aria-label="当前卡片">01 / 01</span>
      <div class="card-viewport" aria-label="穿搭卡片，可左右滑动" aria-live="polite">
        <div class="card-track">
          <article class="outfit-card is-new" aria-label="穿搭卡片 1">
            <div class="card-media" aria-label="卡片 1 图片，可左右滑动">
              <div class="card-pages">
                <div class="card-page" aria-label="图片 1"></div>
              </div>
            </div>
            <nav class="card-pagination" aria-label="卡片分页">
              <button class="page-dot is-active" type="button" data-page="0" aria-label="第 1 页" aria-current="page"></button>
            </nav>
          </article>
        </div>
      </div>
      </div>
      <nav class="home-card-pagination" aria-label="切换首页卡片"></nav>
    </section>

    <section class="inspiration-page" aria-label="灵感参考" hidden>
      <header class="inspiration-heading">
        <span>灵感</span>
        <output class="inspiration-count">0 / 30</output>
      </header>
      <div class="inspiration-stage" aria-label="可拖动旋转的灵感照片球体">
        <div class="inspiration-sphere"></div>
      </div>
      <footer class="library-footer">
        <span class="library-name" tabindex="0" title="双击重命名">穿搭灵感</span>
        <nav class="library-pagination" aria-label="切换穿搭灵感"></nav>
      </footer>
    </section>

    <section class="inspiration-viewer" aria-label="灵感照片大图" hidden>
      <button class="inspiration-viewer-favorite" type="button" aria-label="收藏穿搭灵感" aria-pressed="false" hidden></button>
      <button class="inspiration-viewer-back" type="button" aria-label="返回灵感照片球体">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <img class="inspiration-viewer-image" alt="" />
    </section>

    <nav class="dock" aria-label="主导航">
      <div class="nav-pill">
        <button class="nav-item is-active" type="button" data-tab="closet" aria-label="衣橱" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 2.5c.8 1.7 2.1 2.5 4 2.5s3.2-.8 4-2.5l2.3 1.2 4 4a1.3 1.3 0 0 1 .1 1.7l-2 2.6a1.3 1.3 0 0 1-1.7.3L18 12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8l-.7.3a1.3 1.3 0 0 1-1.7-.3l-2-2.6a1.3 1.3 0 0 1 .1-1.7l4-4L8 2.5Z"/>
          </svg>
          <span>搭配</span>
        </button>
        <button class="nav-item" type="button" data-tab="inspire" aria-label="灵感" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M9 18h6M9.8 21h4.4"/>
            <path d="M8.1 14.4A6.5 6.5 0 1 1 15.9 14.4c-1.15.8-1.4 1.5-1.4 2.6h-5c0-1.1-.25-1.8-1.4-2.6Z"/>
          </svg>
          <span>灵感</span>
        </button>
      </div>

      <button class="add-button" type="button" aria-label="添加新穿搭" data-action="add">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>

    <section class="detail-page" aria-label="穿搭详情页" hidden>
      <button class="detail-back editorial-icon-button" type="button" aria-label="返回卡片库"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button>
      <button class="favorite-toggle" type="button" aria-label="收藏当前页" aria-pressed="false"></button>
      <button class="edit-toggle" type="button" aria-label="进入编辑模式" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m5 16.5-.8 3.3 3.3-.8L18.7 7.8l-2.5-2.5L5 16.5Z"/>
          <path d="m14.8 6.7 2.5 2.5"/>
        </svg>
      </button>

      <button class="new-outfit-button" type="button" aria-label="在当前卡片中新建一页">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <button class="background-toggle" type="button" aria-label="更换背景" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 1 0 0 18h1.1a1.8 1.8 0 0 0 1.3-3.1 1.8 1.8 0 0 1 1.3-3.1H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/>
          <circle cx="7.5" cy="10" r="1"/>
          <circle cx="10" cy="6.8" r="1"/>
          <circle cx="14" cy="6.8" r="1"/>
          <circle cx="16.8" cy="10" r="1"/>
        </svg>
      </button>

      <section class="background-panel" aria-label="选择背景" hidden>
        <div class="background-panel-content">
          <div class="background-list"></div>
          <button class="add-background" type="button" aria-label="添加自定义背景">
            <span aria-hidden="true">+</span>
            <small>添加背景</small>
          </button>
        </div>
        <label class="background-opacity-control" hidden>
          <span>透明度</span>
          <input class="background-opacity" type="range" min="0" max="100" value="100" />
          <output class="background-opacity-value">100%</output>
        </label>
      </section>

      <div class="editor-canvas" aria-label="穿搭编辑画布"></div>
      <div class="detail-empty-state"><button type="button" class="detail-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>开始搭配</span></button></div>
      <button class="detail-more-toggle" type="button" aria-label="打开创作台"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      <button class="detail-pages-toggle" type="button" aria-label="平铺查看所有页面"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="detail-page-count">1/1</span></button>
      <section class="detail-pages-overview" aria-label="所有搭配页面" hidden>
        <header><button class="detail-pages-close" type="button" aria-label="返回内页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><span>全部页面</span><button class="detail-pages-sort" type="button" aria-label="调整页面顺序" aria-pressed="false">排序</button></header>
        <p class="detail-pages-sort-hint" hidden>拖动图片排序，或双击页码修改位置</p>
        <div class="detail-pages-grid"></div>
      </section>

      <aside class="editor-panel" aria-label="添加穿搭单品">
        <div class="image-popover" aria-label="格子图片" hidden>
          <div class="popover-piece-tabs" aria-label="选择同类型格子"></div>
          <div class="image-thumbnail-list"></div>
          <div class="popover-blank-zone">长按空白处 3 秒删除</div>
        </div>
        <div class="editor-panel-viewport">
          <div class="editor-panel-pages">
            <div class="editor-panel-page">
              <div class="category-grid">
                <button type="button" data-category="top">Top</button>
                <button type="button" data-category="bottom">Bottom</button>
                <button type="button" data-category="dress">Dress</button>
                <button type="button" data-category="shoes">Shoes</button>
                <button type="button" data-category="bag">Bag</button>
                <button type="button" data-category="accessories">Accessories</button>
                <span class="panel-actions">
                  <button class="reframe-piece icon-action" type="button" data-action="reframe-piece" aria-label="重新选择图片显示区域" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg>
                  </button>
                  <button class="delete-piece icon-action" type="button" data-action="delete-piece" aria-label="删除所选格子" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                  </button>
                  <button class="confirm-edit icon-action" type="button" data-action="confirm-edit" aria-label="确认编辑">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
                  </button>
                </span>
              </div>
              <div class="palette-edit-row" aria-label="色卡编辑">
                <span class="palette-edit-label"><span class="palette-mini-dots" aria-hidden="true"><i></i><i></i><i></i></span>色卡</span>
                <span class="palette-edit-hint">长按图片取色</span>
                <button class="palette-remove" type="button" aria-label="减少一个色卡" disabled>−</button>
                <output class="palette-count" aria-label="色卡数量">0</output>
                <button class="palette-add" type="button" aria-label="增加一个色卡">＋</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <input class="image-input" type="file" accept="image/*" hidden />
      <input class="background-input" type="file" accept="image/*" hidden />
    </section>
    <section class="favorites-page" aria-label="收藏库" hidden>
      <header class="favorites-header"><button class="favorites-back" type="button" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><h2>收藏</h2></header>
      <nav class="favorites-tabs" aria-label="收藏分类">
        <button type="button" data-favorites-tab="outfits" aria-pressed="true">搭配</button>
        <button type="button" data-favorites-tab="items" aria-pressed="false">单品</button>
        <button type="button" data-favorites-tab="inspiration" aria-pressed="false">灵感</button>
      </nav>
      <div class="favorites-list"></div>
      <p class="favorites-empty">点击穿搭内页的爱心，收藏喜欢的搭配</p>
    </section>
    <section class="image-framing" aria-label="选择图片显示区域" hidden>
      <header class="framing-toolbar">
        <button type="button" class="framing-cancel">取消</button>
        <span>选择显示区域</span>
        <button type="button" class="framing-confirm" disabled>完成</button>
      </header>
      <div class="framing-stage">
        <div class="framing-photo">
          <img alt="待选择区域的原图" draggable="false" />
          <div class="framing-selection" hidden>
            <span class="framing-grid"></span>
            <button type="button" class="framing-resize" aria-label="拖动调整选框大小"></button>
          </div>
        </div>
      </div>
      <footer class="framing-footer">
        <div class="framing-actions">
          <button class="framing-replace" type="button">替换图片</button>
          <button class="framing-favorite" type="button" aria-pressed="false">♡ 收藏单品</button>
        </div>
        <p>拖动选框选择位置，拖动右下角调整大小</p>
        <label>选框大小 <input class="framing-size" aria-label="选框大小" type="range" min="0" max="100" value="100" /></label>
        <label class="framing-zoom-control" hidden>图片缩放 <input class="framing-zoom" aria-label="图片缩放" type="range" min="50" max="300" value="100" /><output>100%</output></label>
        <small>保留完整原图，完成后仍可在格子里移动和缩放</small>
      </footer>
    </section>
    <input class="framing-replace-input" type="file" accept="image/*" hidden />
    <input class="inspiration-input" type="file" accept="image/*" multiple hidden />
    <div class="toast" role="status" aria-live="polite"></div>
    <section class="detail-tools-sheet" role="dialog" aria-modal="true" aria-label="创作台" hidden>
      <div class="detail-tools-content">
        <header><h2 class="detail-tools-title">创作台</h2><button class="detail-tools-close" type="button" aria-label="关闭">×</button></header>
        <div class="detail-tools-body"></div>
      </div>
    </section>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
    </div>
  </div>
  <script src="./app.js?v=detail-safe-area-1"></script>
  <script src="./home-cards.js"></script>
  <script src="./detail-tools.js"></script>
  <script src="./editorial.js"></script>
  <script src="./manual-palette.js"></script>
</body>
</html>
